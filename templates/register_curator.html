{% extends "base.html" %}
{% block title %}Регистрация куратора{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-64px)] flex bg-gray-50">
    <div class="flex-1 flex items-center justify-center p-8">
        <div class="w-full max-w-md">
            <div class="mb-8">
                <h1 class="text-3xl font-extrabold text-gray-900 mb-1">Регистрация куратора</h1>
                <p class="text-gray-500 text-sm">Уже есть аккаунт? <a href="/auth" class="font-semibold text-primary hover:underline ml-1">Войти</a></p>
            </div>

            <div id="error-box" class="hidden mb-5 flex items-start gap-3 bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 text-sm">
                <span id="error-text"></span>
            </div>

            <div class="card p-8">
                <form id="register-form" class="flex flex-col gap-5">
                    <input type="hidden" name="role" value="curator">
                    
                    <div>
                        <label class="form-label">ФИО куратора</label>
                        <input id="name" type="text" class="form-input" placeholder="Исмагилов Аскар Ерланович" required>
                    </div>

                    <div>
                        <label class="form-label">Специализация (Профессия)</label>
                        <select id="profession" class="form-input form-select">
                            <option value="IT">💻 IT (Информационные технологии)</option>
                            <option value="Economics">📈 Экономика</option>
                            <option value="Medicine">🏥 Медицина</option>
                            <option value="Law">⚖️ Юриспруденция</option>
                            <option value="Design">🎨 Дизайн</option>
                        </select>
                    </div>

                    <div class="pt-4 border-t border-gray-100">
                        <label class="form-label">Email</label>
                        <input id="email" type="email" class="form-input" placeholder="curator@mail.com" required>
                    </div>

                    <div>
                        <label class="form-label">Пароль</label>
                        <input id="password" type="password" class="form-input" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full py-3 mt-2 font-bold">Стать наставником</button>
                    <p class="text-[10px] text-gray-400 text-center uppercase tracking-widest mt-2">Вы сможете управлять группой до 20 студентов</p>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
