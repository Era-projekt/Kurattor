{% extends "base.html" %}
{% block title %}Поиск{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-6 py-12">

    <!-- Header -->
    <div class="text-center mb-10">
        <h1 class="text-3xl font-extrabold text-gray-900 mb-2" data-i18n="search_title">Поиск пользователей</h1>
        <p class="text-gray-400 text-sm" data-i18n="search_sub">Найдите студентов и кураторов по имени или специальности</p>
    </div>

    <!-- Search bar -->
    <div class="relative mb-8">
        <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
        </div>
        <input id="search-input" type="text"
               class="form-input pl-12 pr-4 py-4 text-base rounded-2xl shadow-sm"
               data-i18n-placeholder="search_placeholder"
               placeholder="Введите имя, специальность..."
               autocomplete="off">
        <div id="search-loader" class="hidden absolute inset-y-0 right-4 flex items-center">
            <div class="w-4 h-4 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div>
        </div>
    </div>

    <!-- Filter chips -->
    <div class="flex gap-2 mb-6 flex-wrap">
        <button data-filter="all" class="filter-chip badge px-4 py-1.5 cursor-pointer badge-primary" data-i18n="search_filter_all">Все</button>
        <button data-filter="student" class="filter-chip badge px-4 py-1.5 cursor-pointer badge-gray" data-i18n="role_student">Студенты</button>
        <button data-filter="curator" class="filter-chip badge px-4 py-1.5 cursor-pointer badge-gray" data-i18n="role_curator">Кураторы</button>
    </div>

    <!-- Results -->
    <div id="results-count" class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-4 hidden"></div>
    <div id="search-results">
        <!-- Empty state -->
        <div class="empty-state card p-10">
            <svg class="mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:56px;height:56px;color:#d1d5db;">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <p class="text-gray-500 font-medium mt-3" data-i18n="search_start_typing">Начните вводить текст</p>
            <p class="text-gray-400 text-sm mt-1" data-i18n="search_hint">Поиск выполняется по имени и специальности</p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentFilter = 'all';
let allResults = [];

// Filter chips
document.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
        currentFilter = chip.getAttribute('data-filter');
        document.querySelectorAll('.filter-chip').forEach(c => {
            c.className = 'filter-chip badge px-4 py-1.5 cursor-pointer badge-gray';
        });
        chip.className = 'filter-chip badge px-4 py-1.5 cursor-pointer badge-primary';
        renderResults(allResults.filter(u => currentFilter === 'all' || u.role === currentFilter));
    });
});

// Search input (debounced)
let timer = null;
const loader = document.getElementById('search-loader');
document.getElementById('search-input').addEventListener('input', e => {
    clearTimeout(timer);
    const q = e.target.value.trim();
    if (!q) {
        allResults = [];
        renderEmpty();
        document.getElementById('results-count').classList.add('hidden');
        return;
    }
    loader.classList.remove('hidden');
    timer = setTimeout(async () => {
        try {
            const res = await fetch(`/api/search_users?q=${encodeURIComponent(q)}`);
            allResults = await res.json();
        } catch (e) { allResults = []; }
        loader.classList.add('hidden');
        const lang = localStorage.getItem('kuraton_lang') || 'ru';
        const tr = translations[lang] || translations['ru'];
        
        const filtered = allResults.filter(u => currentFilter === 'all' || u.role === currentFilter);
        const countEl = document.getElementById('results-count');
        countEl.innerText = `${tr.search_results_found}: ${filtered.length}`;
        countEl.classList.remove('hidden');
        renderResults(filtered);
    }, 280);
});

function renderEmpty(key = 'search_start_typing') {
    const lang = localStorage.getItem('kuraton_lang') || 'ru';
    const tr = translations[lang] || translations['ru'];
    const msg = tr[key] || '...';
    
    document.getElementById('search-results').innerHTML = `
        <div class="empty-state card p-10">
            <svg class="mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:56px;height:56px;color:#d1d5db;">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <p class="text-gray-500 font-medium mt-3">${msg}</p>
        </div>`;
}

function renderResults(users) {
    const container = document.getElementById('search-results');
    const lang = localStorage.getItem('kuraton_lang') || 'ru';
    const tr = translations[lang] || translations['ru'];
    
    if (!users.length) { renderEmpty('search_no_results'); return; }

    const profIcons = { IT: '💻', Economics: '📈', Medicine: '🏥', Law: '⚖️', Design: '🎨' };

    container.innerHTML = `<div class="space-y-3 anim-fade-in">` +
        users.map(u => {
            const isCurator = u.role === 'curator';
            const avatarClass = isCurator ? 'avatar-success' : 'avatar-primary';
            const badgeClass = isCurator ? 'badge-success' : 'badge-primary';
            const badgeText = isCurator ? tr.role_curator : tr.role_student;
            const icon = profIcons[u.profession] || '🎓';

            return `<div class="card p-5 flex items-center gap-4 hover:-translate-y-0.5 transition-all duration-200 hover:shadow-lg">
                <div class="avatar avatar-md ${avatarClass}">${(u.name || '?')[0]}</div>
                <div class="flex-1 min-w-0">
                    <p class="font-bold text-gray-900 truncate">${u.name || '—'}</p>
                    <p class="text-sm text-gray-400">${icon} ${u.profession || '—'}</p>
                </div>
                <span class="badge ${badgeClass} flex-shrink-0">${badgeText}</span>
            </div>`;
        }).join('') + `</div>`;
}
</script>
{% endblock %}
